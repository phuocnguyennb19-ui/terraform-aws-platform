# ===========================================================================
# BASE STACK — the shared infrastructure an environment owns once
#
# One config file is one Terraform state. This one owns the network, the
# security groups, the registry, the load balancer and the ECS cluster. The
# application stacks (see app.yaml) disable all of it and locate these resources
# by name and tag.
#
# Lives in the APPLICATION repository, not here. CI copies it into a clone of
# terraform-aws-platform and runs Terraform from that clone's root:
#
#   terraform init -reconfigure -backend-config=backend.hcl
#   terraform plan -var config_file=config.yaml
#
# No secret belongs in this file. Database passwords are generated by AWS into
# Secrets Manager; the Redis AUTH token is referenced by secret ARN; container
# secrets are injected by ARN through the execution role.
# ===========================================================================

global:
  project: platform
  environment: dev            # dev | staging | prod — prod triggers the hardening floor
  region: ap-southeast-1
  owner: platform-engineering
  cost_center: engineering-dev

  # Assume a per-environment role rather than using long-lived keys. The
  # credential running Terraform then needs nothing but permission to assume it.
  assume_role_arn: null

  tags:
    Stack: base

# ---------------------------------------------------------------------------
# Foundation
# ---------------------------------------------------------------------------

kms:
  enabled: true               # omit `keys:` to get one key per purpose:
                              # ebs, rds, logs, secrets, eks, ecr

vpc:
  enabled: true
  # Environment CIDRs must not overlap: 10.10 / 10.20 / 10.30. Overlapping
  # ranges make VPC peering and Transit Gateway attachment impossible, and the
  # fix is a re-address of a live environment.
  cidr: 10.10.0.0/16
  az_count: 2

  # TRADE: one NAT gateway instead of one per AZ. Saves roughly $35/month and
  # makes egress a single-AZ dependency. Forced to false when environment: prod.
  single_nat_gateway: true

  enable_flow_logs: true
  flow_log_retention_days: 7

  # Each interface endpoint is billed hourly per AZ, so name only what is used.
  # These five are what keeps ECS task startup off the NAT gateway.
  interface_endpoints:
    - ecr.api
    - ecr.dkr
    - logs
    - secretsmanager
    - ssmmessages           # required by `aws ecs execute-command`

security_groups:
  enabled: true
  # Which groups get created follows the enabled modules — the ECS group appears
  # because ecs_cluster is on below.

iam:
  enabled: true
  permissions_boundary_arn: null

cloudwatch:
  enabled: true
  log_retention_days: 30
  create_dashboard: false
  alarm_subscriptions: {}
  # An email subscription stays PENDING_CONFIRMATION until a human clicks the
  # link, and Terraform reports success either way — an unconfirmed address is a
  # silent alerting gap. Prefer an https endpoint into the on-call tool.
  #
  # alarm_subscriptions:
  #   oncall:
  #     protocol: https
  #     endpoint: https://events.pagerduty.com/integration/REPLACE/enqueue

# ---------------------------------------------------------------------------
# Registry
# ---------------------------------------------------------------------------

ecr:
  enabled: true
  # false shares one repository across environments, which is what image
  # promotion requires: build once in dev, deploy the same digest to prod.
  use_name_prefix: false
  repositories:
    api:
      image_tag_mutability: IMMUTABLE
      scan_on_push: true
      keep_tagged_count: 30

# ---------------------------------------------------------------------------
# Edge
#
# No domain is managed in dev, so the ALB is reached on its own DNS name over
# HTTP. Enabling acm requires route53 and a zone to validate in.
# ---------------------------------------------------------------------------

route53:
  enabled: false
  # domain_name: example.com
  # app_hostname: api          # publishes api.example.com; omit for the apex
  # create_zone: false

acm:
  enabled: false

alb:
  enabled: true
  internal: false
  ingress_cidrs:
    - 0.0.0.0/0
  application_port: 8080
  access_logs_retention_days: 14

  # Target groups are created here, on the ALB, and referenced by key from an
  # ecs_services entry. target_type defaults to "ip" whenever ECS or EKS is in
  # the stack, because a Fargate task has no instance to register.
  target_groups:
    app:
      port: 8080
      health_check_path: /healthz
  default_target_group_key: app

# ---------------------------------------------------------------------------
# ECS cluster
#
# The cluster is a scheduling boundary shared by every service in the
# environment. Services live in their own configs and their own states.
# ---------------------------------------------------------------------------

ecs_cluster:
  enabled: true
  container_insights: true

  # Keep one task on on-demand FARGATE regardless of the weights below: that is
  # the floor that survives a Spot capacity shortage.
  fargate_base: 1
  fargate_weight: 1
  # TRADE: half the tasks above the base run on Spot in dev. Spot is reclaimed
  # with a two-minute warning — keep this at 0 for anything that cannot absorb a
  # task being killed mid-request.
  fargate_spot_weight: 1

# ---------------------------------------------------------------------------
# Everything else this stack does not build
#
# eks, ec2, rds, elasticache and lambda are absent on purpose. Every module
# defaults to disabled — locals.tf reads each one as
# `try(config.<module>.enabled, false)` — so a module this stack does not build
# needs no entry at all. Add the block to build it; there is no `enabled: false`
# to write.
# ---------------------------------------------------------------------------
