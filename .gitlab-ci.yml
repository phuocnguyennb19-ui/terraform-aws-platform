include:
  - local: ci/terraform.gitlab-ci.yml

stages:
  - validate
  - plan
  - apply

variables:
  TF_VERSION: "1.5.7"
  TF_TEST_VERSION: "1.9.8"
  TF_ROOT: terraform
  TF_IN_AUTOMATION: "true"

# The branch is the environment: dev, staging and prod each have one. A push (or Run pipeline)
# on that branch runs its environment; a merge request runs the environment of its target branch.
workflow:
  rules:
    - if: $CI_MERGE_REQUEST_TARGET_BRANCH_NAME =~ /^(dev|staging|prod)$/
    - if: $CI_COMMIT_BRANCH =~ /^(dev|staging|prod)$/

# terraform/ecs and terraform/eks are independent stacks with their own state. Each job runs once
# per stack; STACK selects terraform/<stack>/, TF_ENV selects terraform/<stack>/<env>/.
.stacks:
  parallel:
    matrix:
      - STACK: [ecs, eks]

validate:
  extends: [.tf-validate, .stacks]
  tags: [tf-validate-runner]

contract-tests:
  extends: [.tf-contract-test, .stacks]
  tags: [tf-contract-tests-runner]

plan:
  extends: [.tf-plan, .stacks]
  tags: [tf-plan-runner]
  rules:
    - if: $CI_COMMIT_BRANCH == "dev" || $CI_MERGE_REQUEST_TARGET_BRANCH_NAME == "dev"
      variables: { TF_ENV: dev }
    - if: $CI_COMMIT_BRANCH == "staging" || $CI_MERGE_REQUEST_TARGET_BRANCH_NAME == "staging"
      variables: { TF_ENV: staging }
    - if: $CI_COMMIT_BRANCH == "prod" || $CI_MERGE_REQUEST_TARGET_BRANCH_NAME == "prod"
      variables: { TF_ENV: prod }

# Merge request pipelines never apply: CI_COMMIT_BRANCH is unset in them.
# needs: plan waits for both stacks' plans; each apply finds its own at terraform/<stack>/tfplan-<env>.
apply:
  extends: [.tf-apply, .stacks]
  tags: [tf-apply-runner]
  resource_group: terraform-$STACK-$TF_ENV
  needs: ["plan"]
  rules:
    - if: $CI_COMMIT_BRANCH == "dev"
      variables: { TF_ENV: dev }
      when: manual
    - if: $CI_COMMIT_BRANCH == "staging"
      variables: { TF_ENV: staging }
      when: manual
    - if: $CI_COMMIT_BRANCH == "prod"
      variables: { TF_ENV: prod }
      when: manual
