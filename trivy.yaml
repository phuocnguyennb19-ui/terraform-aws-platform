# trivy config — the maintained successor to tfsec, which was folded into Trivy.
# tfsec still runs but no longer receives new rules; new work should target this.
#
#   trivy config --config trivy.yaml .
#   make sec

severity:
  - MEDIUM
  - HIGH
  - CRITICAL

exit-code: 1

scan:
  skip-dirs:
    - "**/.terraform/**"
    - "**/examples/**"

misconfiguration:
  terraform:
    exclude-downloaded-modules: true

  # Findings suppressed here are DECISIONS, not noise. Each records what was
  # accepted and why. Anything not listed is expected to pass.
  #
  # AVD-AWS-0053  ALB is internet-facing.
  #               That is what an internet-facing ALB is for. It is the only
  #               tier that accepts external traffic, it terminates TLS, and
  #               everything behind it sits in private subnets.
  #
  # AVD-AWS-0107  Security group ingress from 0.0.0.0/0.
  #               Applies to the ALB group on 80/443 only. The bastion and EKS
  #               API groups reject 0.0.0.0/0 through a variable validation
  #               block, so this cannot silently spread.
  #
  # AVD-AWS-0104  Security group egress to 0.0.0.0/0.
  #               The compute tiers pull container images, OS packages and
  #               third-party APIs. Narrowing this needs an egress proxy or VPC
  #               endpoints, not a shorter CIDR list. The data tiers already
  #               have no egress rule at all.
  #
  # AVD-AWS-0088  S3 bucket encryption uses AES256 rather than KMS.
  #               Applies to the ALB access log bucket. ELB log delivery cannot
  #               write to a KMS-encrypted bucket; it fails silently, leaving an
  #               empty bucket and no error. AES256 is the supported option.
  exclude:
    - AVD-AWS-0053
    - AVD-AWS-0107
    - AVD-AWS-0104
    - AVD-AWS-0088
