# checkov — policy-as-code over the Terraform source.
#
#   checkov --config-file .checkov.yaml
#   make checkov

directory:
  - .

framework:
  - terraform

quiet: true
compact: true

download-external-modules: false

skip-path:
  - .terraform
  - examples

# Each skip is a recorded decision with a reason, not a way to get to a green
# run. A finding that is genuinely a defect gets fixed instead.
skip-check:
  # CKV_AWS_18 / CKV_AWS_144 — S3 access logging and cross-region replication on
  # the ALB access log bucket. Access-logging a log bucket is circular, and
  # replicating access logs to a second region is a cost with no stated recovery
  # objective behind it.
  - CKV_AWS_18
  - CKV_AWS_144

  # CKV_AWS_338 — CloudWatch log group retention of at least one year.
  # Retention is a per-environment input. Production floors it at 90 days in
  # main.tf and sets 365 in terraform.tfvars; dev deliberately keeps 7.
  - CKV_AWS_338

  # CKV2_AWS_5 — "security group is unused". Every group here is attached by an
  # environment root that enables the matching workload; checkov cannot see
  # across the count-guarded module boundary.
  - CKV2_AWS_5

  # CKV_AWS_79 — IMDSv1 must be disabled. It is: both the ec2 and eks modules
  # set http_tokens = "required". Checkov does not resolve the value through the
  # module's metadata_options variable.
  - CKV_AWS_79
