# ===========================================================================
# DEVELOPMENT
#
# Values only. The composition lives in the repository root and is the same for
# every environment; this file is the only thing that differs, alongside
# backend.hcl.
#
#   terraform init -reconfigure -backend-config=environments/dev/backend.hcl
#   terraform plan  -var config_file=environments/dev/config.yaml
#
# A module is built only when its block sets `enabled: true`. A module that is
# absent from this file is not built — there is no `enabled: false` to write.
#
# No secret belongs here. The database password is generated by AWS into Secrets
# Manager and never passes through Terraform; a Redis AUTH token is referenced by
# secret ARN.
# ===========================================================================

global:
  project: platform
  environment: dev
  region: ap-southeast-1
  owner: platform-engineering
  cost_center: engineering-dev

# ---------------------------------------------------------------------------
# Foundation — built in every environment
# ---------------------------------------------------------------------------

kms:
  enabled: true

vpc:
  enabled: true
  cidr: "10.10.0.0/16"
  az_count: 2

  # TRADE: one NAT gateway for the whole VPC. A single AZ failure takes egress
  # with it, which is acceptable here and is not in staging or prod.
  single_nat_gateway: true

  enable_flow_logs: true
  flow_log_retention_days: 7

security_groups:
  enabled: true

iam:
  enabled: true

cloudwatch:
  enabled: true
  log_retention_days: 7
  create_dashboard: true
  alarm_subscriptions: {}

# ---------------------------------------------------------------------------
# Workloads
# ---------------------------------------------------------------------------

ecr:
  enabled: true
  use_name_prefix: false
  repositories:
    api:
      image_tag_mutability: IMMUTABLE
      scan_on_push: true
      untagged_expiry_days: 3
      keep_tagged_count: 20

alb:
  enabled: true
  internal: false
  ingress_cidrs: ["0.0.0.0/0"]
  application_port: 8080
  access_logs_retention_days: 14
  target_groups:
    app:
      health_check_path: /healthz

eks:
  enabled: true
  kubernetes_version: "1.31"

  public_api_access: true
  public_api_cidrs: ["203.0.113.0/24"]   # REPLACE with your office/VPN egress range

  node_groups:
    general:
      instance_types: ["t3.large"]
      # TRADE: spot only. Fine for a dev cluster; prod keeps an on-demand floor.
      capacity_type: SPOT
      min_size: 1
      max_size: 3
      desired_size: 2
      disk_size: 50

rds:
  enabled: true
  engine: postgres
  engine_version: "16.4"
  family: postgres16
  major_engine_version: "16"
  instance_class: db.t4g.medium
  allocated_storage: 20
  max_allocated_storage: 100
  multi_az: false
  backup_retention_period: 3
  database_name: appdb
  username: dbadmin
