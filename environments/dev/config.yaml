global:
  project: platform
  environment: dev
  region: ap-southeast-1
  owner: platform-engineering
  cost_center: engineering-dev

kms:
  enabled: true

vpc:
  enabled: true
  cidr: "10.10.0.0/16"
  az_count: 2

  single_nat_gateway: true

  enable_flow_logs: true
  flow_log_retention_days: 7

security_groups:
  enabled: true

iam:
  enabled: true

cloudwatch:
  enabled: true
  log_retention_days: 7
  create_dashboard: true
  alarm_subscriptions: {}

ecr:
  enabled: true
  use_name_prefix: false
  repositories:
    api:
      image_tag_mutability: IMMUTABLE
      scan_on_push: true
      untagged_expiry_days: 3
      keep_tagged_count: 20

alb:
  enabled: true
  internal: false
  ingress_cidrs: ["0.0.0.0/0"]
  application_port: 8080
  access_logs_retention_days: 14
  target_groups:
    app:
      health_check_path: /healthz

eks:
  enabled: true
  kubernetes_version: "1.31"

  public_api_access: true
  public_api_cidrs: ["203.0.113.0/24"]

  node_groups:
    general:
      instance_types: ["t3.large"]
      capacity_type: SPOT
      min_size: 1
      max_size: 3
      desired_size: 2
      disk_size: 50

rds:
  enabled: true
  engine: postgres
  engine_version: "16.4"
  family: postgres16
  major_engine_version: "16"
  instance_class: db.t4g.medium
  allocated_storage: 20
  max_allocated_storage: 100
  multi_az: false
  backup_retention_period: 3
  database_name: appdb
  username: dbadmin
