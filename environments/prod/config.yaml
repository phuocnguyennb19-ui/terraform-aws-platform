# ===========================================================================
# PRODUCTION
#
# Values only. The composition lives in the repository root and is the same for
# every environment; this file is the only thing that differs, alongside
# backend.hcl.
#
#   terraform init -reconfigure -backend-config=environments/prod/backend.hcl
#   terraform plan  -var config_file=environments/prod/config.yaml
#
# Several controls here cannot be weakened from this file. The root applies a
# hardening floor when environment == "prod" — multi-AZ, deletion protection, a
# final snapshot on delete, 30 days of backups, flow logs, a private EKS API
# endpoint, one NAT gateway per AZ, and a 90-day log retention minimum. Setting
# a weaker value below has no effect; the floor wins.
#
# That is deliberate. A control that can be switched off by editing a values
# file is a control that eventually gets switched off in a hurry, by someone
# chasing an unrelated failure at 03:00.
#
# No secret belongs here. The database password is generated by AWS into Secrets
# Manager and never passes through Terraform; a Redis AUTH token is referenced by
# secret ARN.
# ===========================================================================

global:
  project: platform
  environment: prod
  region: ap-southeast-1
  owner: platform-engineering
  cost_center: production

  # Assume a per-environment role rather than running as a long-lived key, so
  # every API call is attributable to this environment.
  # assume_role_arn: "arn:aws:iam::111122223333:role/terraform-platform-prod"

# ---------------------------------------------------------------------------
# Foundation — built in every environment
# ---------------------------------------------------------------------------

kms:
  enabled: true

vpc:
  enabled: true
  cidr: "10.30.0.0/16"
  az_count: 3

  # Pinned explicitly in prod: an implicit AZ list can reorder between plans and
  # move subnets, which is a replacement, not a change.
  azs: ["ap-southeast-1a", "ap-southeast-1b", "ap-southeast-1c"]

  single_nat_gateway: false
  enable_flow_logs: true
  flow_log_retention_days: 365

  # Keep control-plane traffic off the NAT gateways and inside the VPC.
  interface_endpoints:
    ["ecr.api", "ecr.dkr", "logs", "ssm", "ssmmessages", "ec2messages", "sts", "kms"]

security_groups:
  enabled: true

iam:
  enabled: true
  # permissions_boundary_arn: "arn:aws:iam::111122223333:policy/platform-boundary"

cloudwatch:
  enabled: true
  log_retention_days: 365
  create_dashboard: true
  alarm_subscriptions: {}

# ---------------------------------------------------------------------------
# DNS and certificates
# ---------------------------------------------------------------------------

route53:
  enabled: true
  domain_name: example.com   # REPLACE
  create_zone: false
  app_hostname: api

acm:
  enabled: true

# ---------------------------------------------------------------------------
# Workloads
# ---------------------------------------------------------------------------

ecr:
  enabled: true
  use_name_prefix: false
  repositories:
    api:
      image_tag_mutability: IMMUTABLE
      scan_on_push: true
      untagged_expiry_days: 14
      keep_tagged_count: 100

alb:
  enabled: true
  internal: false
  ingress_cidrs: ["0.0.0.0/0"]
  application_port: 8080
  access_logs_retention_days: 365
  target_groups:
    app:
      health_check_path: /healthz

eks:
  enabled: true
  kubernetes_version: "1.31"

  # Private API endpoint. The hardening floor enforces this in prod regardless.
  public_api_access: false
  public_api_cidrs: []

  node_groups:
    general:
      instance_types: ["m6i.xlarge"]
      capacity_type: ON_DEMAND
      min_size: 3
      max_size: 12
      desired_size: 3
      disk_size: 100
      labels:
        workload: general

    spot:
      instance_types: ["m6i.xlarge", "m6a.xlarge", "m5.xlarge"]
      capacity_type: SPOT
      min_size: 0
      max_size: 20
      desired_size: 2
      disk_size: 100
      labels:
        workload: burstable
      taints:
        spot:
          key: capacity
          value: spot
          effect: NO_SCHEDULE

rds:
  enabled: true
  engine: postgres
  engine_version: "16.4"
  family: postgres16
  major_engine_version: "16"
  instance_class: db.r6g.xlarge
  allocated_storage: 200
  max_allocated_storage: 1000
  multi_az: true
  backup_retention_period: 30
  database_name: appdb
  username: dbadmin

elasticache:
  enabled: true
  node_type: cache.r7g.large
  engine_version: "7.1"
  parameter_group_family: redis7
  num_cache_clusters: 3

  # Create the secret outside Terraform so the token never enters state.
  # auth_token_secret_arn: "arn:aws:secretsmanager:ap-southeast-1:111122223333:secret:prod/redis/auth-AbCdEf"
