global:
  project: platform
  environment: prod
  region: ap-southeast-1
  owner: platform-engineering
  cost_center: production

kms:
  enabled: true

vpc:
  enabled: true
  cidr: "10.30.0.0/16"
  az_count: 3

  azs: ["ap-southeast-1a", "ap-southeast-1b", "ap-southeast-1c"]

  single_nat_gateway: false
  enable_flow_logs: true
  flow_log_retention_days: 365

  interface_endpoints:
    ["ecr.api", "ecr.dkr", "logs", "ssm", "ssmmessages", "ec2messages", "sts", "kms"]

security_groups:
  enabled: true

iam:
  enabled: true

cloudwatch:
  enabled: true
  log_retention_days: 365
  create_dashboard: true
  alarm_subscriptions: {}

route53:
  enabled: true
  domain_name: example.com
  create_zone: false
  app_hostname: api

acm:
  enabled: true

ecr:
  enabled: true
  use_name_prefix: false
  repositories:
    api:
      image_tag_mutability: IMMUTABLE
      scan_on_push: true
      untagged_expiry_days: 14
      keep_tagged_count: 100

alb:
  enabled: true
  internal: false
  ingress_cidrs: ["0.0.0.0/0"]
  application_port: 8080
  access_logs_retention_days: 365
  target_groups:
    app:
      health_check_path: /healthz

eks:
  enabled: true
  kubernetes_version: "1.31"

  public_api_access: false
  public_api_cidrs: []

  node_groups:
    general:
      instance_types: ["m6i.xlarge"]
      capacity_type: ON_DEMAND
      min_size: 3
      max_size: 12
      desired_size: 3
      disk_size: 100
      labels:
        workload: general

    spot:
      instance_types: ["m6i.xlarge", "m6a.xlarge", "m5.xlarge"]
      capacity_type: SPOT
      min_size: 0
      max_size: 20
      desired_size: 2
      disk_size: 100
      labels:
        workload: burstable
      taints:
        spot:
          key: capacity
          value: spot
          effect: NO_SCHEDULE

rds:
  enabled: true
  engine: postgres
  engine_version: "16.4"
  family: postgres16
  major_engine_version: "16"
  instance_class: db.r6g.xlarge
  allocated_storage: 200
  max_allocated_storage: 1000
  multi_az: true
  backup_retention_period: 30
  database_name: appdb
  username: dbadmin

elasticache:
  enabled: true
  node_type: cache.r7g.large
  engine_version: "7.1"
  parameter_group_family: redis7
  num_cache_clusters: 3
