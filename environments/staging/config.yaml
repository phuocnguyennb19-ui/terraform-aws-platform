# ===========================================================================
# STAGING
#
# Values only. The composition lives in the repository root and is the same for
# every environment; this file is the only thing that differs, alongside
# backend.hcl.
#
#   terraform init -reconfigure -backend-config=environments/staging/backend.hcl
#   terraform plan  -var config_file=environments/staging/config.yaml
#
# This is the production rehearsal: same shape as prod, smaller instances. A
# procedure that does not work here does not go to prod.
#
# No secret belongs here. The database password is generated by AWS into Secrets
# Manager and never passes through Terraform; a Redis AUTH token is referenced by
# secret ARN.
# ===========================================================================

global:
  project: platform
  environment: staging
  region: ap-southeast-1
  owner: platform-engineering
  cost_center: engineering-staging

# ---------------------------------------------------------------------------
# Foundation — built in every environment
# ---------------------------------------------------------------------------

kms:
  enabled: true

vpc:
  enabled: true
  cidr: "10.20.0.0/16"
  az_count: 3
  single_nat_gateway: false
  enable_flow_logs: true
  flow_log_retention_days: 30

security_groups:
  enabled: true

iam:
  enabled: true

cloudwatch:
  enabled: true
  log_retention_days: 30
  create_dashboard: true
  alarm_subscriptions: {}

# ---------------------------------------------------------------------------
# DNS and certificates
# ---------------------------------------------------------------------------

route53:
  enabled: true
  domain_name: staging.example.com   # REPLACE with your delegated zone
  create_zone: false
  app_hostname: api

acm:
  enabled: true

# ---------------------------------------------------------------------------
# Workloads
# ---------------------------------------------------------------------------

ecr:
  enabled: true
  use_name_prefix: false
  repositories:
    api:
      image_tag_mutability: IMMUTABLE
      scan_on_push: true
      untagged_expiry_days: 7
      keep_tagged_count: 30

alb:
  enabled: true
  internal: false
  ingress_cidrs: ["0.0.0.0/0"]
  application_port: 8080
  access_logs_retention_days: 30
  target_groups:
    app:
      health_check_path: /healthz

eks:
  enabled: true
  kubernetes_version: "1.31"

  public_api_access: true
  public_api_cidrs: ["203.0.113.0/24"]   # REPLACE

  node_groups:
    general:
      instance_types: ["t3.large"]
      capacity_type: ON_DEMAND
      min_size: 2
      max_size: 6
      desired_size: 2
      disk_size: 50
      labels:
        workload: general

    spot:
      instance_types: ["t3.large", "t3a.large", "m5.large"]
      capacity_type: SPOT
      min_size: 0
      max_size: 6
      desired_size: 1
      disk_size: 50
      labels:
        workload: burstable
      taints:
        spot:
          key: capacity
          value: spot
          effect: NO_SCHEDULE

rds:
  enabled: true
  engine: postgres
  engine_version: "16.4"
  family: postgres16
  major_engine_version: "16"
  instance_class: db.t4g.large
  allocated_storage: 50
  max_allocated_storage: 200
  multi_az: true
  backup_retention_period: 7
  database_name: appdb
  username: dbadmin

elasticache:
  enabled: true
  node_type: cache.t4g.small
  engine_version: "7.1"
  parameter_group_family: redis7
  num_cache_clusters: 2

  # Create the secret outside Terraform so the token never enters state.
  # auth_token_secret_arn: "arn:aws:secretsmanager:ap-southeast-1:111122223333:secret:staging/redis/auth-AbCdEf"
