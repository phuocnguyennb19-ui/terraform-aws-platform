name: terraform

on:
  pull_request:
    paths: ["**.tf", "**.tfvars", "**.hcl", ".github/workflows/terraform.yml"]
  push:
    branches: [master, main]

permissions:
  contents: read
  # OIDC. No long-lived AWS keys in CI secrets — the workflow exchanges its
  # GitHub identity for a short-lived role session at run time.
  id-token: write
  pull-requests: write

env:
  TF_VERSION: "1.5.7"

jobs:
  # -------------------------------------------------------------------------
  # Everything that needs no AWS credentials. Runs on every PR.
  # -------------------------------------------------------------------------
  static:
    name: static checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      - name: format
        run: make fmt-check

      - name: version constraints are consistent
        run: make versions-check

      - name: environment roots have not diverged
        run: make env-drift

      - name: validate every environment
        run: make validate-all

  lint:
    name: tflint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
      - uses: terraform-linters/setup-tflint@v4
      - run: make lint

  security:
    name: security scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: trivy config
        uses: aquasecurity/trivy-action@0.28.0
        with:
          scan-type: config
          scan-ref: .
          trivy-config: trivy.yaml
          exit-code: "1"

      - name: checkov
        uses: bridgecrewio/checkov-action@master
        with:
          config_file: .checkov.yaml
          soft_fail: false

  # -------------------------------------------------------------------------
  # Plan. Needs credentials, so it assumes a per-environment read-mostly role.
  #
  # There is no apply job here on purpose. Applying from a PR pipeline means a
  # merge is a deploy; a production apply should be a deliberate, separately
  # approved action against a plan a human has read.
  # -------------------------------------------------------------------------
  plan:
    name: plan (${{ matrix.environment }})
    runs-on: ubuntu-latest
    needs: [static]
    if: github.event_name == 'pull_request'
    strategy:
      fail-fast: false
      matrix:
        environment: [dev, staging, prod]
    environment: ${{ matrix.environment }}
    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_PLAN_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          role-session-name: gha-plan-${{ matrix.environment }}

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      - name: init
        run: make init ENV=${{ matrix.environment }}

      - name: plan
        run: make plan ENV=${{ matrix.environment }}

      # The plan file itself is not uploaded as an artifact: a saved plan
      # contains resolved values, and anyone who can download a build artifact
      # could read them.
      - name: summarise the plan
        run: |
          make show ENV=${{ matrix.environment }} \
            | tail -50 >> "$GITHUB_STEP_SUMMARY"
