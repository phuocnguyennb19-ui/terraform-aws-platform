environment: prod
account_id: "REPLACE-ME"
region: ap-southeast-1

platform:
  type: ecs

dns:
  domain: example.com

services:
  api:
    image: api:REPLACE-ME
    size: large
    replicas: 2
    public: true
    health_check: /healthz
    autoscaling:
      min: 2
      max: 10

database:
  enabled: true
  size: large

cache:
  enabled: true
  size: large
