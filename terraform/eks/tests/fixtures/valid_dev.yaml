environment: dev
account_id: "111122223333"
region: ap-southeast-1

chart:
  repository: oci://111122223333.dkr.ecr.ap-southeast-1.amazonaws.com/charts
  name: application
  version: 2.0.0

cluster:
  access:
    gitlab-plan:
      principal_arn: "arn:aws:iam::111122223333:role/gitlab-plan"
      policy: admin-view

services:
  api:
    image: api:1.4.2
    size: medium
    replicas: 2
    env:
      LOG_LEVEL: info
  worker:
    image: worker:1.4.2
    autoscaling:
      min: 1
      max: 4

database:
  enabled: true
  size: small
