environment: prod
account_id: "REPLACE-ME"
region: ap-southeast-1

chart:
  repository: oci://REPLACE-ME.dkr.ecr.ap-southeast-1.amazonaws.com/charts
  name: application
  version: "2.0.0"

cluster:
  access:
    gitlab-plan:
      principal_arn: "arn:aws:iam::REPLACE-ME:role/REPLACE-ME"
      policy: admin-view

services:
  api:
    image: api:REPLACE-ME
    size: large
    replicas: 2
    health_check: /healthz
    autoscaling:
      min: 2
      max: 10

database:
  enabled: true
  size: large

cache:
  enabled: true
  size: large
